kotlinx-serialization = "1.11.0"
ksp = "2.3.12"
ktfmt = "0.64"
lifecycle = "2.11.0"
material3 = "1.5.0-beta01"
metro = "1.4.5"
navigation3 = "1.2.0"
room = "3.0.3"
savedstate = "1.5.0"
sdk-compile = "37"
